name: Grill Workflow Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  grill-workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run grill workflow tests
        run: make test-grill-workflow
